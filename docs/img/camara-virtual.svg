<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Cámara virtual de la AR (vista lateral, escala real 50 px = 1 m)</title>
  <rect width="720" height="360" fill="#ffffff"/>
  <!-- road -->
  <line x1="20" y1="300" x2="700" y2="300" stroke="#555" stroke-width="2"/>
  <text x="24" y="320" fill="#555">vía (y = 0, o la elevación de la maqueta)</text>
  <!-- ribbon on the road from 3 m -->
  <line x1="210" y1="300" x2="690" y2="300" stroke="#29b6f6" stroke-width="7" stroke-linecap="round"/>
  <text x="330" y="320" fill="#0277bd">cinta: de ribbonStart (3 m) a 90 m (110 m en el HUD) →</text>
  <!-- camera -->
  <rect x="50" y="228" width="20" height="14" rx="3" fill="#333"/>
  <line x1="60" y1="242" x2="60" y2="300" stroke="#999" stroke-dasharray="4 3"/>
  <text x="8" y="275" fill="#333">height</text>
  <text x="8" y="290" fill="#333">1,3 m</text>
  <!-- horizon -->
  <line x1="60" y1="235" x2="700" y2="235" stroke="#999" stroke-dasharray="6 5"/>
  <text x="600" y="228" fill="#777">horizonte</text>
  <!-- optical axis, pitch 5° down: drop 12 m * tan5 * 50 = 52 px at x=660 -->
  <line x1="60" y1="235" x2="660" y2="287.5" stroke="#e65100" stroke-width="1.5"/>
  <text x="430" y="262" fill="#e65100">eje óptico: pitch = 5° hacia abajo</text>
  <!-- FOV edges: +15° (up) and -25° (down) -->
  <line x1="60" y1="235" x2="560" y2="101" stroke="#6a1b9a" stroke-width="1.5"/>
  <line x1="60" y1="235" x2="199.4" y2="300" stroke="#6a1b9a" stroke-width="1.5"/>
  <path d="M 160 208.2 A 103 103 0 0 1 152.4 278.1" fill="none" stroke="#6a1b9a" stroke-width="1.2"/>
  <text x="60" y="150" fill="#6a1b9a">fov = 40° vertical</text><text x="60" y="166" fill="#6a1b9a">(lo visible en pantalla)</text>
  <text x="150" y="345" fill="#6a1b9a">el borde de abajo toca la vía a h / tan(25°) ≈ 2,8 m</text>
  <!-- camera label -->
  <text x="40" y="215" fill="#333">cámara (origin)</text>
  <text x="300" y="40" fill="#333" font-weight="bold">Cámara de la AR sobre la cámara del teléfono</text>
  <text x="300" y="58" fill="#555">rotation.y = −(yaw + yawOffset) · rotation.x = −(pitch − pendiente)</text>
  <text x="300" y="76" fill="#555">rotation.z = −mountRoll · orden YXZ · near 0,3 m · far 3000 m</text>
</svg>
