<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Equivalencia de la cámara espejo (misma escala que optica-lateral.svg)</title>
  <rect width="760" height="470" fill="#ffffff"/>
  <!-- windshield plane -->
  <line x1="398" y1="249" x2="158" y2="93" stroke="#1e88e5" stroke-width="3"/>
  <text x="20" y="80" fill="#1565c0">plano del parabrisas (punto G, normal n)</text>
  <!-- dash -->
  <line x1="242" y1="249" x2="398" y2="249" stroke="#777" stroke-width="2"/>
  <!-- real iPad rectangle -->
  <rect x="289" y="243" width="41" height="6" fill="#212121"/>
  <text x="130" y="272" fill="#212121">rectángulo real del iPad</text>
  <text x="130" y="288" fill="#212121">(esquinas pa, pb, pc)</text>
  <!-- eye and mirrored eye -->
  <circle cx="125" cy="150" r="6" fill="#c62828"/>
  <text x="50" y="144" fill="#c62828">E (ojo)</text>
  <line x1="125" y1="150" x2="197" y2="40" stroke="#8e24aa" stroke-dasharray="5 4"/>
  <circle cx="197" cy="40" r="6" fill="#8e24aa"/>
  <text x="210" y="36" fill="#8e24aa">E′ = Refl(E)</text>
  <!-- off-axis frustum from E' through the iPad edges, extended -->
  <line x1="197" y1="40" x2="468" y2="460" stroke="#8e24aa" stroke-width="1.5"/>
  <line x1="197" y1="40" x2="385" y2="460" stroke="#8e24aa" stroke-width="1.5"/>
  <polygon points="197,40 330,249 289,249" fill="#8e24aa" fill-opacity="0.12"/>
  <text x="420" y="330" fill="#6a1b9a">frustum fuera de eje (Kooima):</text>
  <text x="420" y="346" fill="#6a1b9a">la cámara en E′ mira el rectángulo real</text>
  <text x="420" y="362" fill="#6a1b9a">y lo que ve atrás es el mundo reflejado</text>
  <text x="420" y="378" fill="#6a1b9a">Refl(p) = p − 2((p − G)·n) n</text>
  <!-- explanation box -->
  <text x="430" y="130" fill="#333" font-weight="bold">Por qué funciona</text>
  <text x="430" y="150" fill="#333">El conductor en E ve el iPad reflejado.</text>
  <text x="430" y="168" fill="#333">Reflejar toda la escena en el vidrio es</text>
  <text x="430" y="186" fill="#333">equivalente: una cámara en E′ que mira</text>
  <text x="430" y="204" fill="#333">el iPad real ve el mundo reflejado.</text>
  <text x="430" y="222" fill="#333">Se dibuja con world.matrix = Refl · worldToCar;</text>
  <text x="430" y="240" fill="#333">espejo, perspectiva y trapecio salen solos.</text>
</svg>
