<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Óptica del HUD, vista lateral, preset Toyota Fortuner 2015 (escala real 260 px = 1 m)</title>
  <rect width="760" height="640" fill="#ffffff"/>
  <!-- horizon from the eye -->
  <line x1="125" y1="150" x2="750" y2="150" stroke="#bbb" stroke-dasharray="6 5"/>
  <text x="680" y="143" fill="#888">horizonte</text>
  <!-- floor (road level) -->
  <line x1="20" y1="540" x2="750" y2="540" stroke="#555" stroke-width="2"/>
  <text x="24" y="532" fill="#555">vía (y = 0)</text>
  <!-- dash and hood -->
  <polyline points="242,249 398,249 723,256 723,540" fill="none" stroke="#777" stroke-width="2"/>
  <text x="246" y="268" fill="#666">tablero 1,12 m</text>
  <text x="600" y="278" fill="#666">capó</text>
  <!-- hood sight line, 9.9° below the horizon -->
  <line x1="125" y1="150" x2="750" y2="258.8" stroke="#999" stroke-dasharray="3 4"/>
  <!-- windshield plane through G, rake 33° -->
  <line x1="398" y1="249" x2="158" y2="93" stroke="#1e88e5" stroke-width="3"/>
  <text x="196" y="86" fill="#1565c0">parabrisas, rake 33°</text>
  <circle cx="398" cy="249" r="4" fill="#1565c0"/>
  <text x="404" y="268" fill="#1565c0">G: base del parabrisas,</text>
  <text x="404" y="284" fill="#1565c0">1,05 m delante del ojo</text>
  <!-- iPad on the dash: z -0.79 .. -0.63 -->
  <rect x="289" y="243" width="41" height="6" fill="#212121"/>
  <text x="246" y="300" fill="#212121">iPad: 16 cm de fondo,</text>
  <text x="246" y="316" fill="#212121">centro 34 cm detrás de G</text>
  <line x1="309" y1="252" x2="300" y2="288" stroke="#212121" stroke-width="0.8"/>
  <!-- light path: iPad centre -> glass hit -> eye -->
  <polyline points="309,246 262,160 125,150" fill="none" stroke="#f57c00" stroke-width="2"/>
  <circle cx="262" cy="160" r="3" fill="#f57c00"/>
  <!-- virtual image of the iPad: tilted 2x rake = 66° -->
  <line x1="371" y1="187" x2="354" y2="149" stroke="#00a86b" stroke-width="5" stroke-linecap="round"/>
  <text x="392" y="106" fill="#00897b">imagen virtual del iPad:</text>
  <text x="392" y="122" fill="#00897b">0,91 m del ojo, inclinada 66° (2 × rake)</text>
  <line x1="392" y1="126" x2="366" y2="160" stroke="#00897b" stroke-width="0.8"/>
  <!-- sight lines through the virtual image edges -->
  <line x1="125" y1="150" x2="750" y2="244" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="125" y1="150" x2="750" y2="147.3" stroke="#2e7d32" stroke-width="1.5"/>
  <!-- eye and mirrored eye -->
  <circle cx="125" cy="150" r="6" fill="#c62828"/>
  <text x="40" y="140" fill="#c62828">ojo E</text>
  <text x="40" y="156" fill="#c62828">1,50 m</text>
  <line x1="125" y1="150" x2="197" y2="40" stroke="#8e24aa" stroke-dasharray="5 4"/>
  <circle cx="197" cy="40" r="6" fill="#8e24aa"/>
  <text x="208" y="44" fill="#8e24aa">E′ = Refl(E): el ojo reflejado en el plano del vidrio</text>
  <line x1="125" y1="150" x2="125" y2="540" stroke="#ddd" stroke-dasharray="2 4"/>
  <!-- legend -->
  <rect x="20" y="560" width="720" height="72" fill="#f7f7f7" stroke="#ddd"/>
  <line x1="32" y1="576" x2="62" y2="576" stroke="#f57c00" stroke-width="2"/>
  <text x="70" y="580" fill="#333">camino de la luz: pantalla del iPad → vidrio (incidencia ~61°, pasado el ángulo de Brewster de 56°) → ojo</text>
  <line x1="32" y1="596" x2="62" y2="596" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="70" y="600" fill="#333">líneas de vista por los bordes de la imagen: −8,5° (tocan la vía a ~10 m) y +0,25° (pasan del horizonte)</text>
  <line x1="32" y1="616" x2="62" y2="616" stroke="#999" stroke-dasharray="3 4"/>
  <text x="70" y="620" fill="#333">línea del capó: −9,9° bajo el horizonte. Marco del carro: origen en la vía bajo el ojo, +y arriba, −z adelante.</text>
</svg>
