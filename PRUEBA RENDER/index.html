<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calle 3D</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="topbar">
      <div id="title">
        <b>Calle 3D</b>
        <span id="where">Parada 1</span>
      </div>
      <div id="modes" role="group" aria-label="Modo de vista">
        <button data-mode="street" class="on" type="button">Calle</button>
        <button data-mode="aerial" type="button">Vista aérea</button>
        <button data-mode="pano" type="button">Panorama</button>
      </div>
    </div>

    <div id="tools">
      <label><input id="photoToggle" type="checkbox" checked /> Foto real</label>
    </div>

    <div id="nav" aria-label="Moverse">
      <button id="back" type="button" title="Atrás (↓)">◀</button>
      <button id="fwd" type="button" title="Adelante (↑)">▶</button>
    </div>

    <canvas id="minimap" width="220" height="220" title="Toca para ir a ese punto"></canvas>

    <div id="hint">Arrastra para mirar · clic en la calle o ↑ ↓ para caminar · rueda para acercar</div>
    <div id="loading">Cargando modelo…</div>

    <script type="module" src="main.js"></script>
  </body>
</html>
